name: Build iOS Physical Device IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Dependencies
        run: |
          cd mobile
          npm install

      - name: Generate iOS Native Project (Expo Prebuild)
        run: |
          cd mobile
          npx expo prebuild --platform ios --clean

      - name: CocoaPods Install
        run: |
          cd mobile/ios
          pod install

      - name: Build Archive for Physical iPhone (iphoneos)
        run: |
          cd mobile/ios
          SCHEME=$(xcodebuild -list -json | python3 -c "import sys, json; print(json.load(sys.stdin)['workspace']['schemes'][0])")
          echo "Compiling for physical iOS device (iphoneos) scheme: $SCHEME"
          xcodebuild clean archive \
            -workspace "$SCHEME.xcworkspace" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Physical Device IPA
        run: |
          cd mobile/ios
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r -y MilkHisab-Physical-Device.ipa Payload
          ls -lh MilkHisab-Physical-Device.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MilkHisab-Physical-Device-IPA
          path: mobile/ios/MilkHisab-Physical-Device.ipa
